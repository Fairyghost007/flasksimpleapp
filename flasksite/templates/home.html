{% extends "layout.html" %}
{% block content %}
<div class="bg-steel d-flex justify-content-between align-items-center p-3 mb-4">
    <h2 class="text-white">Products</h2>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a href="{{ url_for('new_product') }}" class="btn btn-primary">New Product</a>
    </div>
</div>

<div>
    {% for product in products %}
    <div class="list-group-item">
        <div class="d-flex align-items-start">
            <img src="{{ url_for('static', filename='profile_pics/' + product.image_file) }}" alt="Product Image"
                class="img-fluid rounded mr-3" style="width: 100px; height: auto;">
            <div>
                <a href="{{ url_for('view_product', product_id=product.id) }}" class="font-weight-bold">{{
                    product.libelle }}</a>
                <p class="text-muted mb-0">{{ product.prix }} Fcfa</p>
            </div>
            {% if current_user.is_authenticated%}
                <form action="{{ url_for('delete_product', product_id=product.id) }}" method="POST" class="ml-auto">
                    <button type="submit" class="btn btn-danger">Delete</button>
                </form>
            {% endif %}
        </div>
    </div>
    {% endfor %}
</div>

{% endblock content %}
